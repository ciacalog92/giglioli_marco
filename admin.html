<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>Area Admin – G.M. Impianti</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/admin.css"/>
</head>
<body class="admin-login-page">

  <div class="admin-login">
    <div class="admin-login__card">

      <div class="admin-login__logo">
        <img src="images/logo.svg" alt="G.M. Impianti Logo" class="admin-login__img"/>
      </div>

      <h1 class="admin-login__title">Area Amministratore</h1>
      <p class="admin-login__sub">G.M. Impianti di Giglioli Marco</p>

      <form id="loginForm" class="admin-login__form" novalidate>
        <div class="aform-group">
          <label for="adminUser">Username</label>
          <input type="text" id="adminUser" name="username"
                 placeholder="admin" required autocomplete="username"/>
        </div>
        <div class="aform-group">
          <label for="adminPass">Password</label>
          <input type="password" id="adminPass" name="password"
                 placeholder="••••••••" required autocomplete="current-password"/>
        </div>
        <div id="loginError" class="admin-login__error" hidden>
          Credenziali non valide. Riprova.
        </div>
        <button type="submit" class="admin-login__btn">Accedi</button>
      </form>

      <a href="index.html" class="admin-login__back">← Torna al sito</a>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
