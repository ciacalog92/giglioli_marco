<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bgGrad" cx="42%" cy="36%" r="72%">
      <stop offset="0%"   stop-color="#eaf7fe"/>
      <stop offset="55%"  stop-color="#bfe4f7"/>
      <stop offset="100%" stop-color="#8fd0ee"/>
    </radialGradient>
    <clipPath id="circ"><circle cx="100" cy="100" r="97"/></clipPath>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="98" fill="url(#bgGrad)"/>
  <circle cx="100" cy="100" r="98" fill="none" stroke="#6fc1e6" stroke-width="2"/>

  <!-- Waves (behind dolphin) -->
  <g clip-path="url(#circ)">
    <path d="M 3,132 C 24,122 44,136 64,126 C 84,116 104,130 124,120 C 144,110 160,124 197,116 L 197,150 L 3,150 Z"
          fill="#1f6f9e" opacity="0.9"/>
    <path d="M 3,121 C 26,111 46,125 66,115 C 86,105 106,120 126,110 C 146,100 162,114 197,106 L 197,135 L 3,135 Z"
          fill="#2fc4dd" opacity="0.85"/>
  </g>

  <!-- ── Dolphin (mirrored: head to the right, matching brand) ── -->
  <g transform="translate(200,0) scale(-1,1)">
  <!-- Main body -->
  <path d="
    M 150,82
    C 152,73 150,63 142,58
    L 135,62
    C 126,54 113,46 99,41
    C 85,36 70,36 59,42
    C 48,48 43,59 45,69
    C 47,78 55,83 63,80
    C 71,77 75,70 79,65
    C 86,58 96,61 104,68
    C 112,75 116,84 120,89
    C 129,89 139,86 145,84
    Z
  " fill="#16395f"/>

  <!-- Upper tail fluke -->
  <path d="
    M 142,58 C 144,49 150,42 157,42
    C 157,50 152,59 142,63 Z
  " fill="#16395f"/>

  <!-- Lower tail fluke -->
  <path d="
    M 145,84 C 149,88 154,94 151,101
    C 147,101 141,94 138,88 Z
  " fill="#16395f"/>

  <!-- Dorsal fin -->
  <path d="
    M 99,43 C 97,34 101,22 109,17
    C 114,25 111,38 107,44 Z
  " fill="#16395f"/>

  <!-- Pectoral flipper -->
  <path d="
    M 78,57 C 83,63 87,74 82,80
    C 77,76 73,65 75,59 Z
  " fill="#102a47"/>

  <!-- Eye -->
  <circle cx="59" cy="66" r="3.2" fill="#fff" opacity="0.92"/>
  <circle cx="59" cy="66" r="1.6" fill="#16395f"/>
  <circle cx="58" cy="65" r="0.7" fill="#fff" opacity="0.6"/>
  </g>
</svg>
