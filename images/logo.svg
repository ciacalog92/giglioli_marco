<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bgGrad" cx="42%" cy="38%" r="68%">
      <stop offset="0%"   stop-color="#c8eaf8"/>
      <stop offset="48%"  stop-color="#72c0e0"/>
      <stop offset="100%" stop-color="#4aa8cc"/>
    </radialGradient>
    <clipPath id="circ"><circle cx="100" cy="100" r="97"/></clipPath>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="98" fill="url(#bgGrad)"/>
  <circle cx="100" cy="100" r="98" fill="none" stroke="#3a98bf" stroke-width="2"/>

  <!-- Waves (behind dolphin) -->
  <g clip-path="url(#circ)">
    <path d="M 3,128 C 22,118 42,132 62,122 C 82,112 102,126 122,116 C 142,106 158,120 197,112 L 197,145 L 3,145 Z"
          fill="#0a7090" opacity="0.8"/>
    <path d="M 3,116 C 25,106 45,120 65,110 C 85,100 105,115 125,105 C 145,95 162,110 197,102 L 197,130 L 3,130 Z"
          fill="#22c5e8" opacity="0.55"/>
  </g>

  <!-- ── Dolphin body (leaping upper-left, tail lower-right) ── -->
  <!-- Main body -->
  <path d="
    M 150,82
    C 152,73 150,63 142,58
    L 135,62
    C 126,54 113,46 99,41
    C 85,36 70,36 59,42
    C 48,48 43,59 45,69
    C 47,78 55,83 63,80
    C 71,77 75,70 79,65
    C 86,58 96,61 104,68
    C 112,75 116,84 120,89
    C 129,89 139,86 145,84
    Z
  " fill="#1a3558"/>

  <!-- Upper tail fluke -->
  <path d="
    M 142,58 C 144,49 150,42 157,42
    C 157,50 152,59 142,63 Z
  " fill="#1a3558"/>

  <!-- Lower tail fluke -->
  <path d="
    M 145,84 C 149,88 154,94 151,101
    C 147,101 141,94 138,88 Z
  " fill="#1a3558"/>

  <!-- Dorsal fin -->
  <path d="
    M 99,43 C 97,34 101,22 109,17
    C 114,25 111,38 107,44 Z
  " fill="#1a3558"/>

  <!-- Pectoral flipper -->
  <path d="
    M 78,57 C 83,63 87,74 82,80
    C 77,76 73,65 75,59 Z
  " fill="#142845"/>

  <!-- Eye -->
  <circle cx="59" cy="66" r="3.2" fill="#fff" opacity="0.9"/>
  <circle cx="59" cy="66" r="1.6" fill="#1a3558"/>
  <circle cx="58" cy="65" r="0.7" fill="#fff" opacity="0.6"/>

  <!-- Text -->
  <text x="100" y="156"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="bold" font-size="18.5" fill="#0f2236"
        letter-spacing="0.4">G.M. Impianti</text>
  <text x="100" y="172"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11.5" fill="#1a3558">di Giglioli Marco</text>
</svg>
